<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业经营智能决策 Agent</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e3e6ea;
    --text: #1f2329; --sub: #8a919f; --accent: #2f6fed;
    --user-bubble: #2f6fed; --user-text: #fff;
    --code-bg: #f0f2f5; --table-head: #f7f8fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .badge { font-size: 12px; color: var(--sub); background: var(--code-bg); padding: 3px 10px; border-radius: 20px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 0; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }
  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  /* 用户消息：头像在右侧（气泡在左） */
  .msg.user > :first-child { order: 2; margin: 4px 0 0 10px; }
  .msg.user > :last-child { order: 1; }
  /* 助手消息：头像在左侧（默认） */
  .msg.bot > :first-child { order: 1; margin: 4px 10px 0 0; }
  .msg.bot > :last-child { order: 2; }
  .msg .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; flex-shrink: 0; }
  .msg.user .avatar { background: var(--accent); }
  .msg.bot .avatar { background: #00b578; }
  /* ---------- 数据采集工作流按钮区 ---------- */
  .wf-bar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 9px 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .wf-label { font-size: 13px; color: var(--sub); margin-right: 4px; font-weight: 600; }
  .wf-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 5px 14px; font-size: 12.5px; cursor: pointer; color: var(--accent); }
  .wf-btn:hover { border-color: var(--accent); background: #f0f5ff; }
  .wf-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .wf-btn.primary:hover { background: #2560d4; }
  .wf-btn:disabled { opacity: .55; cursor: not-allowed; }
  .wf-status { font-size: 12.5px; margin-left: 6px; }
  .wf-status.running { color: var(--accent); }
  .wf-status.ok { color: #00b578; }
  .wf-status.err { color: #e5484d; }
  .bubble { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.65; font-size: 14px; word-break: break-word; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 4px; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.bot .md { max-width: 100%; }
  .msg.bot > div:last-child { flex: 1; min-width: 0; }
  /* ---------- KPI 指标卡 ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin: 4px 0 14px; }
  .kpi { background: #fbfcfe; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .kpi-label { font-size: 11.5px; color: var(--sub); margin-bottom: 3px; }
  .kpi-value { font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
  .kpi-delta { font-size: 11.5px; margin-top: 3px; min-height: 16px; font-weight: 600; }
  .kd.up { color: #00b578; }
  .kd.down { color: #e5484d; }
  .kd.flat { color: var(--sub); }
  /* ---------- 报告章节卡片 ---------- */
  .md-sec { border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(20,30,50,.04); }
  .sec-head { display: flex; align-items: center; gap: 7px; padding: 8px 14px; font-size: 14px; font-weight: 700; color: var(--sec, var(--accent)); background: color-mix(in srgb, var(--sec, var(--accent)) 7%, #fff); border-bottom: 1px solid color-mix(in srgb, var(--sec, var(--accent)) 18%, var(--border)); }
  .sec-body { padding: 4px 14px 12px; }
  .sec-sub { font-size: 13.5px; font-weight: 700; color: var(--text); margin: 10px 0 2px; }
  /* 列表条目卡片化 */
  .md-list { list-style: none; margin: 6px 0 2px; padding: 0; }
  .md-list li { position: relative; background: #fafbfd; border: 1px solid #eceef2; border-radius: 8px; padding: 7px 10px 7px 24px; margin: 6px 0; line-height: 1.6; font-size: 13.5px; }
  .md-list li::before { content: ''; position: absolute; left: 9px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--sec, var(--accent)); opacity: .75; }
  .md-list li b { color: var(--sec, var(--accent)); }
  /* 数字徽章 */
  .num { font-weight: 700; padding: 0 4px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  .num.neg { color: #e5484d; background: #fef0f0; }
  .num.pos { color: #00b578; background: #eef9f4; }
  .num.money { color: #2f6fed; background: #eef4ff; }
  /* markdown 渲染 */
  .md h1, .md h2 { font-size: 18px; margin: 14px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .md h3, .md h4 { font-size: 15px; margin: 12px 0 6px; }
  .md p { margin: 6px 0; font-size: 13.5px; }
  .md ul, .md ol { margin: 6px 0 6px 22px; }
  .md li { margin: 3px 0; }
  .md table { border-collapse: separate; border-spacing: 0; margin: 8px 0; width: 100%; font-size: 12.8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .md th, .md td { border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md tr:last-child td { border-bottom: none; }
  .md th { background: var(--table-head); font-weight: 600; white-space: nowrap; }
  .md tbody tr:nth-child(even) { background: #fafbfc; }
  .md code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; font-family: Consolas, monospace; }
  .md pre { background: var(--code-bg); padding: 10px 14px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 4px 12px; color: var(--sub); margin: 8px 0; background: #f8faff; border-radius: 0 6px 6px 0; font-size: 13px; }
  .meta { font-size: 12px; color: var(--sub); margin-top: 8px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .trace { margin-top: 8px; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
  .trace summary { cursor: pointer; color: var(--accent); user-select: none; }
  .trace ul { margin: 8px 0 0 18px; list-style: none; }
  .trace li { margin: 4px 0; color: var(--sub); }
  .trace li b { color: var(--text); }
  .err { color: #e5484d; }
  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 14px 24px; }
  .input-row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #input { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; resize: none; font-family: inherit; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 26px; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .typing { color: var(--sub); font-size: 13px; }
  .suggest { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .suggest button { border: 1px solid var(--border); background: var(--panel); border-radius: 16px; padding: 5px 14px; font-size: 12.5px; color: var(--accent); cursor: pointer; }
  .suggest button:hover { border-color: var(--accent); }
  .suggest-tag { font-size: 12px; color: var(--sub); font-weight: 600; padding: 2px 6px; }
</style>
</head>
<body>
<header>
  <h1>🏪 企业经营智能决策 Agent</h1>
  <span class="badge">数据分析 · 知识问答 · 智能诊断 · 自动执行</span>
</header>

<div class="wf-bar">
  <span class="wf-label">📦 数据采集</span>
  <button class="wf-btn" onclick="runWorkflow('campaign')">智选展位</button>
  <button class="wf-btn" onclick="runWorkflow('traffic')">客流分析</button>
  <button class="wf-btn" onclick="runWorkflow('transaction')">交易分析</button>
  <button class="wf-btn" onclick="runWorkflow('consult')">在线咨询</button>
  <button class="wf-btn primary" onclick="runWorkflow('all')">全部刷新</button>
  <span id="wfStatus" class="wf-status"></span>
</div>

<div id="chat">
  <div class="wrap">
    <div class="msg bot">
      <div class="avatar">🤖</div>
      <div>
        <div class="bubble">
          你好，我是门店经营分析助手 👋 经营数据分析和门店内部制度问题都可以问我：
          <div class="suggest">
            <span class="suggest-tag">📊 经营分析</span>
            <button onclick="ask('分析最近7天1号门店营业额下降原因并给出优化建议')">1号店营业额下降分析</button>
            <button onclick="ask('分析最近7天智选展位推广的花费与ROI情况，找出低效推广，并给出预算优化建议')">推广ROI分析</button>
            <button onclick="ask('各门店综合表现排名怎么样')">门店综合排名</button>
            <button onclick="ask('最近7天团建套餐品类表现如何，为什么下滑')">团建套餐分析</button>
            <span class="suggest-tag">📖 内部制度</span>
            <button onclick="ask('我是新员工，每天上班时间是多少，忘记打卡怎么办')">上班时间与忘打卡</button>
            <button onclick="ask('门店晋升需要什么条件，怎么报名')">晋升条件与报名</button>
            <button onclick="ask('薪资绩效是怎么算的')">薪资绩效核算</button>
            <button onclick="ask('顾客不记得场次怎么安抚')">咨询话术参考</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="2" placeholder="输入你的问题（经营分析 / 内部制度都可以），Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send" onclick="send()">发送</button>
  </div>
</footer>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const MAX_HISTORY = 6;   // 与后端滑动窗口一致
let history = [];        // [{role, content}]
let busy = false;

/* ---------------- 轻量 Markdown 渲染（零依赖，报告卡片化） ---------------- */
const SECTION_META = {
  '结论摘要':  { icon: '📌', color: '#00b578' },
  '关键指标':  { icon: '📊', color: '#2f6fed' },
  '原因归因':  { icon: '🔍', color: '#f59e0b' },
  '优化建议':  { icon: '💡', color: '#8b5cf6' },
  '风险提示':  { icon: '⚠️', color: '#e5484d' },
  '下一步动作': { icon: '⚡', color: '#0ea5e9' },
};
function sectionMeta(title) {
  for (const k in SECTION_META) if (title.includes(k)) return SECTION_META[k];
  return { icon: '📄', color: '#2f6fed' };
}
/* 行内：code/粗体/斜体 + 数字高亮（下降红、上升绿、金额蓝） */
function inline(text) {
  let t = text
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>');
  t = t.replace(/([¥￥]\s?[\d][\d,]*(?:\.\d+)?)/g, '<span class="num money">$1</span>');
  t = t.replace(/(-?\d+(?:\.\d+)?\s?%)/g, (m) => {
    const neg = m.trim().startsWith('-');
    return `<span class="num ${neg ? 'neg' : 'pos'}">${m}</span>`;
  });
  return t;
}
/* 宽松 section 标题识别：】必出现，【可省（模型吞【后开头字，如"关键指标】"→"指标】"也能识别） */
const SECTION_PATTERNS = [
  ['结论摘要', /(?:【)?\s*(?:结?论?)?摘?要?\s*】/],
  ['关键指标', /(?:【)?\s*(?:关?键?)?指?标?\s*】/],
  ['原因归因', /(?:【)?\s*(?:原?因?)?归?因?\s*】/],
  ['建议',     /(?:【)?\s*(?:建?议?)?\s*】/],
  ['风险提示', /(?:【)?\s*(?:风?险?)?提?示?\s*】/],
  ['下一步动作', /(?:【)?\s*(?:下?一?步?)?动?作?\s*】/],
  ['优化建议', /(?:【)?\s*(?:优?化?)?建?议?\s*】/],
];
function renderMarkdown(md) {
  if (!md) return '';
  const renderBodyHtml = (raw) => {
    const blines = raw.split(/\r?\n/);
    let bh = '';
    let items = [], tbl = [];
    const flushItems = () => {
      if (items.length) { bh += '<ul class="md-list">' + items.map(li => '<li>' + inline(li) + '</li>').join('') + '</ul>'; items = []; }
    };
    const flushTbl = () => {
      if (!tbl.length) return;
      const rows = tbl.filter((r, idx) => !(idx === 1 && /^\s*[-|:\s]+\s*$/.test(r)));
      if (rows.length >= 2) {
        let t = '<table><thead><tr>' + rows[0].split('|').slice(1, -1).map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr></thead><tbody>';
        for (let ri = 1; ri < rows.length; ri++) t += '<tr>' + rows[ri].split('|').slice(1, -1).map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>';
        bh += t + '</tbody></table>';
      }
      tbl = [];
    };
    for (const bl of blines) {
      if (/^\s*\|/.test(bl)) { flushItems(); tbl.push(bl); continue; }
      if (tbl.length) flushTbl();
      const ul = bl.match(/^\s*[-*]\s+(.*)$/);
      if (ul) { flushItems(); items.push(ul[1]); continue; }
      const ol = bl.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) { flushItems(); items.push(ol[1]); continue; }
      flushItems();
      if (bl.trim()) bh += '<p>' + inline(bl) + '</p>';
    }
    flushTbl(); flushItems();
    return bh || '<p>' + inline(raw) + '</p>';
  };
  const buildSec = (title, body) => {
    const meta = sectionMeta(title);
    return `<div class="md-sec" style="--sec:${meta.color}"><div class="sec-head">${meta.icon} ${title}</div><div class="sec-body">${renderBodyHtml(body)}</div></div>`;
  };

  // —— 第一遍：行级识别（兼容 ## / ✦ / 【关键词】在行任意位置 / 行首关键词 + 冒号） ——
  const lines = md.split(/\r?\n/);
  const lineSecs = [];
  let cur = null, buf = '', intro = '';
  for (const line of lines) {
    let title = null, restInline = '';
    let m = line.match(/^##\s+(.+)$/);
    if (m) { title = m[1].trim(); }
    if (!title) { m = line.match(/^#\s+(.+)$/); if (m) title = m[1].trim(); }
    if (!title) { m = line.match(/^[✦★❖▍◆●■]\s*(.+)$/); if (m) title = m[1].trim(); }
    // 宽松 SECTION_PATTERNS：【关键】可出现在行任意位置，支持吞字（关键指标→指标、风险提示→提示）
    if (!title) {
      for (const [t, re] of SECTION_PATTERNS) {
        const mm = line.match(new RegExp('(' + re.source + ')\\s*(.*)$'));
        if (mm) { title = t; restInline = mm[2].trim(); break; }
      }
    }
    if (!title) {
      for (const kw of SECTION_PATTERNS.map(p => p[0])) {
        if (line.trim() === kw || line.trim().startsWith(kw + '：') || line.trim().startsWith(kw + ':')) {
          title = kw;
          restInline = line.trim().slice(kw.length).replace(/^[：:]\s*/, '');
          break;
        }
      }
    }
    if (title) {
      if (cur) lineSecs.push({ title: cur, body: buf.trim() });
      else intro += (intro ? '\n' : '') + line;
      cur = title;
      buf = restInline;
    } else {
      if (cur) buf += '\n' + line; else intro += (intro ? '\n' : '') + line;
    }
  }
  if (cur) lineSecs.push({ title: cur, body: buf.trim() });

  if (lineSecs.length >= 2) {
    let html = intro.trim() ? `<p>${inline(intro.trim())}</p>` : '';
    for (const s of lineSecs) html += buildSec(s.title, s.body);
    return html;
  }

  // —— 第二遍：段中关键词位置切分兜底（关键词子串匹配，宽容吞字） ——
  let html = intro.trim() ? `<p>${inline(intro.trim())}</p>` : '';
  const INLINE_KEYS = ['结论摘要', '关键指标', '原因归因', '建议', '风险提示', '下一步动作', '优化建议'];
  let lastIdx = 0, lastKw = null, lastEnd = 0;
  for (const kw of INLINE_KEYS) {
    const idx = md.indexOf(kw, lastEnd);
    if (idx === -1) continue;
    if (lastKw) {
      const body = md.slice(lastIdx + lastKw.length, idx).replace(/^[：:]\s*/, '').trim();
      html += buildSec(lastKw, body);
    }
    lastIdx = idx;
    lastKw = kw;
    lastEnd = idx + kw.length;
  }
  if (lastKw) {
    const body = md.slice(lastIdx + lastKw.length).replace(/^[：:]\s*/, '').trim();
    html += buildSec(lastKw, body);
  } else {
    html += `<p>${inline(md)}</p>`;
  }
  return html;
}
/* ---------------- KPI 指标卡（基于 Pandas 结构化指标） ---------------- */
function renderKpis(m, question) {
  const ms = (m && m.metrics) || {};
  if (!ms || !Object.keys(ms).length) return '';
  const money = v => (v == null || isNaN(v)) ? '-' : '¥' + Number(v).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  const delta = (v) => v == null || isNaN(v) ? '' : (v > 0 ? `<span class="kd up">▲ +${v}%</span>` : v < 0 ? `<span class="kd down">▼ ${v}%</span>` : '<span class="kd flat">— 0%</span>');
  // 按用户问题关键词筛 KPI：只展示与问题相关的指标卡，避免"问 A 显示 B"的脱节
  const q = (question || '').toLowerCase();
  const isMarketing = /推广|广告|投放|roi|转化|点击|花销|消耗/.test(q);
  const allCards = [
    { key: 'gmv',     label: '营业额 GMV',  value: money(ms.gmv),         d: delta(ms.gmv_change_pct) },
    { key: 'order',   label: '订单量',       value: ms.order_count ?? '-', d: delta(ms.order_change_pct) },
    { key: 'aov',     label: '客单价',       value: ms.avg_order_value != null ? '¥' + Number(ms.avg_order_value).toFixed(2) : '-', d: delta(ms.aov_change_pct) },
    { key: 'spend',   label: '推广花费',     value: money(ms.campaign_total_spent), d: '' },
    { key: 'roi',     label: '推广 ROI',     value: ms.campaign_roi_avg != null ? Number(ms.campaign_roi_avg).toFixed(2) : '-', d: '' },
    { key: 'cvr',     label: '点击转化率',   value: ms.campaign_conversion_rate != null ? Number(ms.campaign_conversion_rate).toFixed(2) + '%' : '-', d: '' },
  ];
  const cards = isMarketing
    ? allCards.filter(c => ['spend', 'roi', 'cvr'].includes(c.key))
    : allCards.filter(c => ['gmv', 'order', 'aov'].includes(c.key));
  if (!cards.length) return '';
  return '<div class="kpis">' + cards.map(c =>
    `<div class="kpi"><div class="kpi-label">${c.label}</div><div class="kpi-value">${c.value}</div><div class="kpi-delta">${c.d}</div></div>`
  ).join('') + '</div>';
}

/* ---------------- 聊天逻辑 ---------------- */
function appendMsg(role, html, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '👤' : '🤖';
  let inner = `<div class="avatar">${avatar}</div><div>`;
  if (role === 'user') inner += `<div class="bubble">${html}</div>`;
  else {
    inner += `<div class="bubble md">${html}</div>`;
    if (meta && meta.trace) {
      const usage = meta.usage || {};
      const costText = `⚡ ${usage.total_tokens || '-'} tokens（入 ${usage.input_tokens || 0} / 出 ${usage.output_tokens || 0}）· ⏱ ${(meta.duration_ms / 1000).toFixed(1)}s`;
      let traceHtml = '<ul>' + meta.trace.map(t => `<li><b>${t.node}</b>：${escapeHtml(t.detail)}</li>`).join('') + '</ul>';
      inner += `<div class="meta"><details class="trace"><summary>查看执行轨迹 ▾</summary>${traceHtml}</details><span>${costText}</span></div>`;
    }
  }
  inner += '</div>';
  div.innerHTML = inner;
  chatEl.querySelector('.wrap').appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 会话持久化：session_id 存 localStorage，刷新/重启不丢上下文（后端按 session 记忆）
const sessionId = localStorage.getItem('biz_session_id')
  || ('s_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
localStorage.setItem('biz_session_id', sessionId);

async function send() {
  const q = inputEl.value.trim();
  if (!q || busy) return;
  inputEl.value = '';
  busy = true; sendBtn.disabled = true;
  appendMsg('user', escapeHtml(q));

  // 助手消息容器（进度 + 打字机）
  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  botDiv.innerHTML = '<div class="avatar">🤖</div><div>'
    + '<div class="bubble typing" id="botProgress">正在分析问题…</div>'
    + '<div class="bubble md" id="botReport" style="display:none"></div>'
    + '<div class="meta" id="botMeta"></div></div>';
  chatEl.querySelector('.wrap').appendChild(botDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  const progEl = botDiv.querySelector('#botProgress');
  const repEl = botDiv.querySelector('#botReport');
  const metaEl = botDiv.querySelector('#botMeta');
  let reportText = '';

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: sessionId })  // 会话持久化：后端按 session 恢复历史
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const blocks = buffer.split('\n\n');
      buffer = blocks.pop(); // 最后一块可能不完整
      for (const block of blocks) {
        let event = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) event = line.slice(7).trim();
          else if (line.startsWith('data: ')) data += line.slice(6);
        }
        if (event === 'progress') {
          progEl.textContent = data;
        } else if (event === 'token') {
          if (repEl.style.display === 'none') { repEl.style.display = ''; progEl.style.display = 'none'; }
          reportText += data;
          repEl.textContent = reportText;   // 打字机纯文本
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (event === 'error') {
          progEl.className = 'bubble err'; progEl.textContent = '出错：' + data;
        } else if (event === 'done') {
          const m = JSON.parse(data);
          const u = m.usage;
          progEl.style.display = 'none';
          repEl.innerHTML = renderKpis(m, m.user_question || q) + renderMarkdown(reportText);   // KPI 卡（按问题筛）+ 卡片化报告
          let cost = '⚡ token 用量不可见';
          if (u) {
            const est = u.estimated ? '约 ' : '';
            cost = `⚡ ${est}总 ${u.total_tokens || '-'} tokens（入 ${u.input_tokens || 0} / 出 ${u.output_tokens || 0}）${u.estimated ? '（估算）' : ''}`;
          }
          metaEl.innerHTML = `${cost} · ⏱ ${(m.duration_ms / 1000).toFixed(1)}s`;
          history.push({ role: 'user', content: q }, { role: 'assistant', content: reportText });
          history = history.slice(-MAX_HISTORY * 2);
        }
      }
    }
    // 流结束兜底：若从未收到 done（异常断流），仍显示已累积内容
    if (repEl.style.display === 'none') { progEl.textContent = '连接中断，请重试'; }
  } catch (e) {
    progEl.className = 'bubble err';
    progEl.textContent = '网络错误：' + e.message;
  }
  busy = false; sendBtn.disabled = false;
  inputEl.focus();
}

function ask(q) { inputEl.value = q; send(); }

/* ---------------- 数据采集工作流（按钮驱动，确定性执行，不走 LLM） ---------------- */
const WF_NAMES = { campaign: '智选展位', traffic: '客流分析', transaction: '交易分析', consult: '在线咨询', all: '全部数据' };
let wfRunning = false;

async function runWorkflow(datasets) {
  if (wfRunning) return;
  wfRunning = true;
  const status = document.getElementById('wfStatus');
  const name = WF_NAMES[datasets] || datasets;
  status.textContent = `⏳ ${name}采集中…（约 1-3 分钟）`;
  status.className = 'wf-status running';
  const btns = document.querySelectorAll('.wf-btn');
  btns.forEach(b => b.disabled = true);
  try {
    const resp = await fetch('/api/workflow/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ datasets })
    });
    const d = await resp.json();
    if (d.success) {
      const parts = Object.entries(d.data || {}).map(([k, v]) => `${k}:${v.success ? '✅' : '❌'}`).join('  ');
      status.textContent = `✅ ${name}刷新完成 — ${parts}`;
      status.className = 'wf-status ok';
    } else {
      status.textContent = `❌ ${name}刷新失败：${d.error || '未知错误（Edge 在线状态/登录态？）'}`;
      status.className = 'wf-status err';
    }
  } catch (e) {
    status.textContent = `❌ ${name}请求异常：${e.message}`;
    status.className = 'wf-status err';
  } finally {
    wfRunning = false;
    btns.forEach(b => b.disabled = false);
  }
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
