server {
    listen 80;
    server_name _;

    # Docker containers may receive a new IP after an app rebuild. Resolve the
    # service name through Docker DNS for each new upstream connection instead
    # of keeping the IP that nginx saw when it first started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app:8000;

    client_max_body_size 20m;

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat/stream uses SSE.
        proxy_buffering off;
        proxy_read_timeout 700s;
    }
}
