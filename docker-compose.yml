version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${BIZ_DB_NAME:-business_agent}
      MYSQL_ROOT_PASSWORD: ${BIZ_DB_PASSWORD:?BIZ_DB_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # 仅供 Windows 宿主机 Collector 写入同一套业务数据库，不对局域网暴露。
      - "127.0.0.1:${BIZ_COLLECTOR_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BIZ_DB_HOST: mysql
      BIZ_DB_PORT: 3306
      BIZ_CHROMA_DIR: /app/chroma_db
      BIZ_STORES_JSON: /app/data/stores.json
      BIZ_COLLECTOR_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
      - rag_uploads:/app/rag/data
      - app_logs:/app/logs
      - ./data/stores.json:/app/data/stores.json:ro
      - fastembed_cache:/root/.cache/fastembed
      - hf_cache:/root/.cache/huggingface
      # Chroma 默认 embedding 模型（约 79MB）首次下载后持久化，避免每次重建 app 都阻塞启动。
      - chroma_onnx_cache:/root/.cache/chroma
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]

volumes:
  mysql_data:
  chroma_data:
  rag_uploads:
  app_logs:
  fastembed_cache:
  hf_cache:
  chroma_onnx_cache:

networks:
  backend:
    driver: bridge
